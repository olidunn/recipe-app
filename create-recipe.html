<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Recipe App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <div class="form">
        <label for="recipeName">
          Name: <input type="text" id="recipeName" />
        </label>
        <textarea id="recipeStepsInput"></textarea>
        <div class="buttonGroup">
          <button style="margin-left: auto" class="button" onclick="preview()">
            Preview
          </button>
          <button
            style="margin-left: auto"
            class="button"
            onclick="saveRecipe()"
          >
            Save
          </button>
        </div>
        <div id="preview-ingredients"></div>
        <div id="preview-steps"></div>
      </div>
    </main>
  </body>

  <script src="./create-recipe.js"></script>
  <script src="./render.js"></script>
</html>
